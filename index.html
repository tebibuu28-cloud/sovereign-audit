<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Audit | Risk Engine</title>
    <style>
        body { background: #050505; color: #d4af37; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        #card { border: 1px solid #1a1a1a; padding: 40px; text-align: center; border-radius: 20px; background: #0a0a0a; box-shadow: 0 20px 60px rgba(0,0,0,0.9); width: 100%; max-width: 450px; }
        .status-bar { font-family: monospace; font-size: 0.8em; color: #00ff00; margin-bottom: 20px; letter-spacing: 1px; }
        h1 { font-size: 2.2em; letter-spacing: 3px; margin: 0; text-transform: uppercase; font-weight: 900; }
        .calc-box { margin-top: 30px; border-top: 1px solid #1a1a1a; padding-top: 20px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.8em; color: #888; text-transform: uppercase; }
        input { background: #111; border: 1px solid #333; padding: 12px; color: #fff; width: 100%; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #d4af37; }
        .result { background: #111; border: 1px dashed #d4af37; padding: 15px; text-align: center; border-radius: 8px; margin-top: 10px; }
        .result span { font-size: 1.5em; font-weight: bold; color: #fff; }
        button { background: #d4af37; color: #000; padding: 15px; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; width: 100%; margin-top: 10px; text-transform: uppercase; }
        button:hover { background: #fff; }
        .footer { margin-top: 30px; font-size: 0.7em; color: #444; }
    </style>
</head>
<body>
    <div id="card">
        <div class="status-bar">[ NODE: ADDIS TITAN ] // RISK ENGINE ACTIVE</div>
        <h1>SOVEREIGN AUDIT</h1>
        
        <div class="calc-box">
            <label>Account Balance ($)</label>
            <input type="number" id="balance" value="5000">
            
            <label>Risk Percentage (%)</label>
            <input type="number" id="risk" value="0.5" step="0.1">
            
            <label>Stop Loss (Pips)</label>
            <input type="number" id="pips" value="15">
            
            <div class="result">
                <label>Recommended Lot Size</label>
                <span id="lotSize">0.17</span>
            </div>
            <button onclick="calculateRisk()">Calculate Position</button>
        </div>

        <div class="footer">JOIN THE WAITLIST FOR THE AI-AUDITOR</div>
        <form action="https://formspree.io/f/xbdppwjk" method="POST" style="margin-top: 15px;">
            <input type="email" name="email" placeholder="Enter email for Beta access..." required>
            <button type="submit" style="font-size: 0.8em; padding: 10px;">Get Beta Access</button>
        </form>
    </div>

    <script>
        function calculateRisk() {
            const balance = document.getElementById('balance').value;
            const risk = document.getElementById('risk').value;
            const pips = document.getElementById('pips').value;
            
            // Basic Forex formula for Standard Lots (assuming $10 per pip per lot)
            const riskAmount = balance * (risk / 100);
            const lotSize = riskAmount / (pips * 10);
            
            document.getElementById('lotSize').innerText = lotSize.toFixed(2);
        }
    </script>
</body>
</html>
