<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Audit | ICT Risk Management</title>
    <style>
        body { 
            background: #050505; 
            color: #d4af37; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
        }
        #card { 
            border: 1px solid #1a1a1a; 
            padding: 60px; 
            text-align: center; 
            border-radius: 20px; 
            background: #0a0a0a; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.9); 
            max-width: 450px;
            position: relative;
        }
        .status-bar {
            font-family: monospace;
            font-size: 0.8em;
            color: #00ff00;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        h1 { 
            font-size: 2.8em; 
            letter-spacing: 4px; 
            margin: 0; 
            text-transform: uppercase;
            font-weight: 900;
        }
        .tagline { 
            color: #888; 
            margin: 15px 0 40px 0; 
            font-style: italic;
            font-size: 1.1em;
        }
        input { 
            background: #111; 
            border: 1px solid #333; 
            padding: 18px; 
            color: #fff; 
            width: 100%; 
            border-radius: 10px; 
            margin-bottom: 20px; 
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s;
        }
        input:focus { border: 1px solid #d4af37; }
        button { 
            background: #d4af37; 
            color: #000; 
            padding: 18px; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            border-radius: 10px; 
            width: 100%; 
            font-size: 1em;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        button:hover { 
            background: #ffffff; 
            transform: translateY(-2px);
        }
        .footer {
            margin-top: 30px;
            font-size: 0.7em;
            color: #444;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="card">
        <div class="status-bar">[ SYSTEM: ONLINE ] // ADDIS TITAN NODE</div>
        <h1>SOVEREIGN AUDIT</h1>
        <p class="tagline">The AI-Powered Hard-Lock for ICT Traders.</p>
        
        <form action="https://formspree.io/f/xbdppwjk" method="POST">
            <input type="email" name="email" placeholder="Enter trader email for early access..." required>
            <button type="submit">ACTIVATE EARLY ACCESS</button>
        </form>

        <div class="footer">POWERED BY ASPIRE & ACQUIRE // 2026</div>
    </div>
</body>
</html>
